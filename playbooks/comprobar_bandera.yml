---
# comprobar_bandera.yml — ¿tu bandera es la correcta?
#
# SECURITY BY DESIGN: el repo NO guarda la bandera en texto plano. Guarda solo su
# huella SHA-256 en  secretos/bandera.sha256. Este playbook calcula la huella de
# LO QUE VOS PASÁS y la compara con la esperada. Si coinciden, la bandera es válida.
# Es la misma idea con la que se guardan las contraseñas: nunca el secreto, solo su
# hash (para contraseñas de verdad, además, se usa hashing lento con sal: bcrypt/argon2).
#
# Uso:
#   ansible-playbook comprobar_bandera.yml -e "bandera=BANDERA{...}"
#
# Ejemplo (formato, no la respuesta):
#   ansible-playbook comprobar_bandera.yml -e "bandera=BANDERA{42-hostx-7}"

- name: Verificar la bandera del reto (por hash, sin exponer el secreto)
  hosts: local
  become: false
  gather_facts: false

  vars:
    bandera: ""   # la pasás con  -e "bandera=BANDERA{...}"

  tasks:
    - name: Necesito que me pases una bandera
      ansible.builtin.assert:
        that:
          - bandera | length > 0
        fail_msg: >-
          Pasame tu bandera así:
          ansible-playbook comprobar_bandera.yml -e "bandera=BANDERA{...}"
        quiet: true

    - name: Revisar que tenga la forma BANDERA{R1-R2-R3}
      ansible.builtin.assert:
        that:
          - bandera | trim is match('^BANDERA\{[0-9]+-[a-z0-9]+-[0-9]+\}$')
        fail_msg: >-
          El formato no cierra. Tiene que ser EXACTAMENTE
          BANDERA{<R1>-<R2>-<R3>}: R1 y R3 son números, R2 es el nombre del archivo
          SIN la extensión '.log', en minúsculas y sin espacios. Ojo con las llaves.
        quiet: true

    - name: Leer la huella esperada (solo el hash vive en el repo)
      ansible.builtin.set_fact:
        hash_esperado: "{{ lookup('file', playbook_dir + '/secretos/bandera.sha256') | trim }}"

    - name: Comparar la huella de tu bandera con la esperada
      ansible.builtin.assert:
        that:
          - (bandera | trim | hash('sha256')) == hash_esperado
        fail_msg: >-
          ❌ Esa no es. Repasá el bucle: ¿procesaste el archivo que tiene un ESPACIO en
          el nombre (el $(ls) te lo parte en dos)? ¿te colaste en viejos/ con un grep -r
          (eso NO cuenta, y la BANDERA que hay ahí adentro es un señuelo del año pasado)?
          ¿contaste el nivel [ERROR] exacto, sin -i y sin el notas.txt? ¿R2 va SIN el
          '.log'? ¿R3 es el código más repetido SOLO dentro del archivo de R2?
        success_msg: "✅ ¡BANDERA CORRECTA! Postmortem cerrado con un bucle bien escrito. 🎉"
        quiet: true

    - name: Trofeo
      ansible.builtin.debug:
        msg: "🏁 {{ bandera | trim }} — capturada con for/while + funciones y verificada con Ansible."
