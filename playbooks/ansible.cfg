# Configuración local de Ansible para este repo.
# Con este archivo presente, no hace falta pasar -i inventory.ini en cada comando.

[defaults]
inventory = ./inventory.ini
# security by design: no aceptar claves de host a ciegas
host_key_checking = True
retry_files_enabled = False
# salida más legible (compatible de ansible-core 2.13 en adelante:
# Debian 12 trae 2.14, Arch 2.21 y Fedora 40+ 2.16; el viejo 'stdout_callback = yaml' ya no existe)
callback_result_format = yaml
interpreter_python = auto_silent
# silenciar los avisos de deprecación de ansible-core 2.20+ (cosméticos para este material)
deprecation_warnings = False

[privilege_escalation]
# become se activa explícitamente por tarea (become: true en la instalación de shellcheck)
become = False
become_method = sudo
